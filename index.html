<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮你 · 极简邮箱工具</title>
<style>
:root {
  --sidebar-w: 220px;
  --detail-w: 420px;
  --header-h: 48px;
  --radius: 6px;
  --font-heading: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
}
[data-theme="dark"] {
  --bg: #0b0b0e;
  --bg-panel: #101014;
  --bg-elevated: #18181c;
  --bg-hover: #1f1f25;
  --bg-active: #27272d;
  --border: #1e1e24;
  --border-light: #2a2a32;
  --text: #ededef;
  --text-secondary: #7f7f8c;
  --text-tertiary: #555560;
  --accent: #7cdece;
  --accent-dim: rgba(124, 222, 206, 0.08);
  --accent-glow: rgba(124, 222, 206, 0.04);
  --orange: #f59e5f;
  --red: #f87171;
  --purple: #a78bfa;
  --yellow: #facc15;
  --blue: #60a5fa;
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --bg-panel: #ffffff;
  --bg-elevated: #eeeeF0;
  --bg-hover: #e6e6ea;
  --bg-active: #dcdce0;
  --border: #dcdce2;
  --border-light: #c8c8d0;
  --text: #1a1a1e;
  --text-secondary: #6b6b78;
  --text-tertiary: #9c9ca8;
  --accent: #0ea5a0;
  --accent-dim: rgba(14, 165, 160, 0.08);
  --accent-glow: rgba(14, 165, 160, 0.04);
  --orange: #d97706;
  --red: #dc2626;
  --purple: #7c3aed;
  --yellow: #ca8a04;
  --blue: #2563eb;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { transition: background .3s ease; }
body > * { transition: background .3s ease, border-color .3s ease, color .3s ease; }
input, textarea, button, select { font: inherit; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--text-tertiary); }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

/* ═══ Header ═══ */
#header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}
#header .logo {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
#header .logo span { color: var(--accent); }
#header .logo .badge {
  font-size: 9px;
  font-weight: 500;
  background: var(--accent-dim);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  margin-left: 4px;
}

/* ═══ Layout ═══ */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
#main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ═══ Sidebar ═══ */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-section { padding: 14px 14px 10px; }
.sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }
.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-label button {
  font-size: 14px;
  color: var(--text-tertiary);
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  transition: all .15s;
}
.sidebar-label button:hover { background: var(--bg-hover); color: var(--text); }
.account-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .15s;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}
.account-item:hover { background: var(--bg-hover); color: var(--text); }
.account-item.active { background: var(--accent-dim); color: var(--accent); }
.account-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.account-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-remove {
  font-size: 12px;
  color: var(--text-tertiary);
  opacity: 0;
  transition: all .15s;
  padding: 2px 4px;
  border-radius: 3px;
}
.account-item:hover .account-remove { opacity: 1; }
.account-remove:hover { color: var(--red); background: rgba(248,113,113,0.1); }

.keyword-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 12px;
  margin: 0 4px 4px 0;
  cursor: pointer;
  transition: all .15s;
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.keyword-tag:hover { border-color: var(--border-light); color: var(--text); }
.keyword-tag.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(124,222,206,0.2); }
.keyword-tag .remove {
  font-size: 10px;
  margin-left: 2px;
  opacity: 0.5;
  padding: 1px;
}
.keyword-tag .remove:hover { opacity: 1; color: var(--red); }
.keyword-add {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all .15s;
  border: 1px dashed var(--border-light);
}
.keyword-add:hover { color: var(--text); border-color: var(--text-tertiary); }

/* ═══ Center Panel ═══ */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}
#search-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
#search-bar input {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
#search-bar input:focus { border-color: var(--accent); }
#search-bar .email-count {
  font-size: 12px;
  color: var(--text-tertiary);
  white-space: nowrap;
}

#email-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.email-row {
  padding: 10px 16px;
  cursor: pointer;
  transition: all .12s;
  border-left: 2px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.email-row:hover { background: var(--bg-elevated); }
.email-row.active {
  background: var(--accent-dim);
  border-left-color: var(--accent);
}
.email-row-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.email-row .sender {
  font-weight: 500;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-row .date {
  font-size: 11px;
  color: var(--text-tertiary);
  white-space: nowrap;
  margin-left: auto;
}
.email-row .subject {
  font-size: 13px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-row .preview {
  font-size: 12px;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-row .meta-line {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.meta-chip {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg-hover);
  color: var(--text-tertiary);
}
.meta-chip.keyword-highlight { background: var(--accent-dim); color: var(--accent); }
.meta-chip.date-chip { background: rgba(245,158,95,0.1); color: var(--orange); }
.meta-chip.calendar-chip { background: rgba(96,165,250,0.1); color: var(--blue); }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-tertiary);
  font-size: 13px;
  gap: 8px;
  padding: 40px;
  text-align: center;
}
.empty-state .icon { font-size: 32px; opacity: 0.3; }

/* ═══ Detail Panel ═══ */
#detail {
  width: var(--detail-w);
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
#detail.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
  font-size: 13px;
}
.detail-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-header .d-subject {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.3;
}
.detail-header .d-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 12px;
  color: var(--text-secondary);
}
.detail-header .d-meta span { display: flex; gap: 6px; }
.detail-header .d-meta .label { color: var(--text-tertiary); width: 44px; }
.detail-body {
  padding: 16px 20px;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  flex: 1;
}
.detail-body .highlight { color: var(--accent); background: var(--accent-dim); padding: 0 2px; border-radius: 2px; }

/* ═══ Extraction Panel ═══ */
#extraction {
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  flex-shrink: 0;
}
#extraction .extract-header {
  padding: 10px 20px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
}
#extraction .extract-header:hover { color: var(--text-secondary); }
#extraction .extract-body {
  padding: 0 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.extract-group {}
.extract-group-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.extract-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 4px;
  background: var(--bg-panel);
  margin-bottom: 3px;
  font-size: 12px;
}
.extract-item .ei-date { color: var(--orange); font-weight: 500; }
.extract-item .ei-label { color: var(--text-secondary); flex: 1; }
.extract-item .ei-action {
  font-size: 11px;
  color: var(--blue);
  padding: 2px 6px;
  border-radius: 3px;
  cursor: pointer;
  transition: all .15s;
}
.extract-item .ei-action:hover { background: rgba(96,165,250,0.1); }
.extract-item .ei-action.done { color: var(--accent); }
.extract-item .ei-keyword { color: var(--accent); }

/* ═══ Modal ═══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
  animation: fadeIn .2s ease;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 360px;
  max-width: 90vw;
  padding: 24px;
  animation: slideUp .2s ease;
}
.modal h3 {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}
.modal label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 4px;
  margin-top: 12px;
}
.modal label:first-of-type { margin-top: 0; }
.modal input, .modal select {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
.modal input:focus, .modal select:focus { border-color: var(--accent); }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}
.modal-actions button {
  padding: 7px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  transition: all .15s;
}
.modal-actions .btn-secondary { background: var(--bg-hover); color: var(--text-secondary); }
.modal-actions .btn-secondary:hover { background: var(--bg-active); color: var(--text); }
.modal-actions .btn-primary { background: var(--accent); color: #0b0b0e; }
.modal-actions .btn-primary:hover { opacity: 0.9; }

/* ═══ Calendar Panel (mini) ═══ */
#calendar-panel {
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  flex-shrink: 0;
}
#calendar-panel .cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
#calendar-panel .cal-header .cal-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}
#calendar-panel .cal-header button {
  font-size: 14px;
  color: var(--text-tertiary);
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px;
  transition: all .15s;
}
#calendar-panel .cal-header button:hover { background: var(--bg-hover); color: var(--text); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  text-align: center;
}
.cal-grid .cal-weekday {
  font-size: 10px;
  color: var(--text-tertiary);
  padding: 4px 0;
  font-weight: 500;
}
.cal-grid .cal-day {
  font-size: 12px;
  padding: 4px 0;
  border-radius: 4px;
  cursor: pointer;
  transition: all .12s;
  color: var(--text-secondary);
  position: relative;
}
.cal-grid .cal-day:hover { background: var(--bg-hover); }
.cal-grid .cal-day.other-month { color: var(--text-tertiary); opacity: 0.3; }
.cal-grid .cal-day.today { color: var(--accent); font-weight: 600; }
.cal-grid .cal-day.has-event::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

/* ═══ Animations ═══ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ Responsive ═══ */
@media (max-width: 900px) {
  #detail { display: none; }
  #detail.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 100%; border-left: none; }
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      邮<span>你</span>
      <span class="badge">BETA</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button onclick="showComposeModal()" style="font-size:12px;color:var(--text-secondary);padding:4px 10px;border-radius:4px;background:var(--bg-elevated);transition:all.15s;font-weight:500;border:1px solid var(--border);" onmouseover="this.style.borderColor='var(--text-tertiary)'" onmouseout="this.style.borderColor='var(--border)'">✎ 写邮件</button>
      <button onclick="showAccountModal()" style="font-size:12px;color:var(--accent);padding:4px 10px;border-radius:4px;background:var(--accent-dim);transition:all.15s;font-weight:500;" onmouseover="this.style.background='rgba(124,222,206,0.15)'" onmouseout="this.style.background='var(--accent-dim)'">+ 绑定邮箱</button>
      <span id="conn-status" title="未连接后端" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-tertiary);transition:all.3s;"></span>
      <button id="sync-btn" onclick="syncEmails()" style="font-size:12px;color:var(--text-secondary);padding:4px 8px;border-radius:4px;transition:all.15s;opacity:0.4;pointer-events:none;" title="同步邮件">↻</button>
      <button id="theme-toggle" onclick="toggleTheme()" style="font-size:14px;color:var(--text-secondary);padding:4px 6px;border-radius:4px;transition:all.15s;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'" title="切换主题">🌙</button>
    </div>
  </header>

  <div id="main">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">邮箱账号</div>
        <div id="account-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">
          关键词筛选
          <button onclick="showKeywordModal()" title="添加关键词">+</button>
        </div>
        <div id="keyword-list"></div>
      </div>
      <div class="sidebar-section" style="flex:1;min-height:0;">
        <div class="sidebar-label">快捷操作</div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div class="account-item" onclick="setFilter('all')" data-filter="all" style="font-size:12px;">📬 全部邮件</div>
          <div class="account-item" onclick="setFilter('today')" data-filter="today" style="font-size:12px;">📌 今日邮件</div>
          <div class="account-item" onclick="setFilter('flagged')" data-filter="flagged" style="font-size:12px;">🏷️ 已标记提醒</div>
          <div class="account-item" onclick="showTestEmailModal()" style="font-size:12px;">🧪 测试收信</div>
          <div class="account-item" onclick="runDiagnose()" style="font-size:12px;">🔍 诊断连接</div>
          <div class="account-item" onclick="resetAllData()" style="font-size:12px;color:var(--text-tertiary);">🔄 重置数据</div>
        </div>
      </div>
    </aside>

    <!-- Center -->
    <section id="center">
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="搜索邮件内容、发件人..." oninput="onSearch()">
        <span class="email-count" id="email-count">0 封邮件</span>
      </div>
      <div id="email-list"></div>
    </section>

    <!-- Detail -->
    <aside id="detail" class="empty">
      <div>选择一封邮件查看详情</div>
    </aside>
  </div>
</div>

<!-- Add Account Modal -->
<div class="modal-overlay" id="account-modal">
  <div class="modal">
    <h3>绑定邮箱</h3>
    <label>邮箱地址</label>
    <input type="email" id="new-account-email" placeholder="your@qq.com">
    <label>显示名称</label>
    <input type="text" id="new-account-name" placeholder="我的QQ邮箱">
    <label>邮箱服务商</label>
    <select id="new-account-provider" onchange="onProviderChange()" style="width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:13px;color:var(--text);outline:none;">
      <option value="">请选择...</option>
      <option value="qq">QQ邮箱 (imap.qq.com:993)</option>
      <option value="163">网易163邮箱 (imap.163.com:993)</option>
      <option value="custom">自定义 IMAP</option>
    </select>
    <div id="custom-imap-fields" style="display:none;">
      <label>IMAP 服务器</label>
      <input type="text" id="new-account-host" placeholder="imap.example.com">
      <label>端口</label>
      <input type="number" id="new-account-port" value="993" placeholder="993">
    </div>
    <label>IMAP 授权码（密码）</label>
    <input type="password" id="new-account-password" placeholder="QQ邮箱请使用16位授权码">

<script>
// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════
let selectedColor = '#7cdece';
let accounts = [];
let keywords = [];
let emails = [];
let reminders = [];
let activeEmailId = null;
let currentFilter = 'all';
let currentTheme = 'dark';
let calendaryYear, calendaryMonth;
let apiBase = '';
let imapConnected = false;
let imapConfig = null; // {email, password, host, port}

function loadState() {
  try {
    const saved = localStorage.getItem('youni_state');
    if (saved) {
      const data = JSON.parse(saved);
      accounts = data.accounts || [];
      keywords = data.keywords || [];
      emails = data.emails || [];
      reminders = data.reminders || [];
      currentTheme = data.theme || 'dark';
      apiBase = data.apiBase || '';
      imapConfig = data.imapConfig || null;
    }
  } catch(e) {}
  if (emails.length === 0) initMockData();
  applyTheme(currentTheme);
  const now = new Date();
  calendaryYear = now.getFullYear();
  calendaryMonth = now.getMonth();
}

function saveState() {
  localStorage.setItem('youni_state', JSON.stringify({ accounts, keywords, emails, reminders, theme: currentTheme, apiBase, imapConfig }));
}

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  saveState();
}

// ═══════════════════════════════════════════
// API & IMAP
// ═══════════════════════════════════════════
function apiUrl(path) {
  const base = apiBase || window.location.origin;
  return base.replace(/\/+$/, '') + path;
}

function onProviderChange() {
  const p = document.getElementById('new-account-provider').value;
  const customFields = document.getElementById('custom-imap-fields');
  if (p === 'custom') {
    customFields.style.display = 'block';
  } else {
    customFields.style.display = 'none';
  }
}

function showNotification(msg, type) {
  let el = document.getElementById('notification');
  if (!el) {
    el = document.createElement('div');
    el.id = 'notification';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;transition:all.3s;opacity:0;pointer-events:none;max-width:80%;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = type === 'error' ? 'rgba(248,113,113,0.15)' : type === 'success' ? 'rgba(124,222,206,0.15)' : 'var(--bg-elevated)';
  el.style.color = type === 'error' ? '#f87171' : type === 'success' ? 'var(--accent)' : 'var(--text)';
  el.style.border = type === 'error' ? '1px solid rgba(248,113,113,0.3)' : type === 'success' ? '1px solid rgba(124,222,206,0.3)' : '1px solid var(--border)';
  el.style.opacity = '1';
  el.style.pointerEvents = 'auto';
  setTimeout(() => { el.style.opacity = '0'; el.style.pointerEvents = 'none'; }, 4000);
}

function setConnStatus(connected) {
  imapConnected = connected;
  const dot = document.getElementById('conn-status');
  const btn = document.getElementById('sync-btn');
  if (dot) {
    dot.style.background = connected ? '#7cdece' : 'var(--text-tertiary)';
    dot.title = connected ? '后端已连接' : '未连接后端';
  }
  if (btn) {
    btn.style.opacity = connected ? '1' : '0.4';
    btn.style.pointerEvents = connected ? 'auto' : 'none';
  }
}

async function connectIMAP(email, password, host, port) {
  try {
    const res = await fetch(apiUrl('/api/connect'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, host, port: Number(port) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '连接失败');
    imapConfig = { email, password, host, port: Number(port) };
    setConnStatus(true);
    showNotification(data.message || 'IMAP 配置成功', 'success');
    return true;
  } catch (err) {
    showNotification('连接失败: ' + err.message, 'error');
    setConnStatus(false);
    return false;
  }
}

async function disconnectIMAP() {
  try {
    await fetch(apiUrl('/api/disconnect'), { method: 'POST' });
  } catch(e) {}
  imapConfig = null;
  setConnStatus(false);
  saveState();
}

async function checkConnection() {
  try {
    const res = await fetch(apiUrl('/api/status'));
    const data = await res.json();
    if (data.connected) {
      setConnStatus(true);
      if (data.email && imapConfig) imapConfig.email = data.email;
      return true;
    }
  } catch(e) {}
  setConnStatus(false);
  return false;
}

async function syncEmails() {
  const btn = document.getElementById('sync-btn');
  if (btn) btn.textContent = '⟳';
  try {
    const res = await fetch(apiUrl('/api/emails?limit=50'));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '同步失败');
    if (data.emails && data.emails.length > 0) {
      const existingIds = new Set(emails.map(e => e.id));
      let newCount = 0, updatedCount = 0;
      data.emails.forEach(e => {
        if (!existingIds.has(e.id)) {
          e.accountId = accounts.length > 0 ? accounts[0].id : 'a1';
          e.read = true;
          emails.unshift(e);
          existingIds.add(e.id);
          newCount++;
        } else {
          // Update existing email's body with decoded text
          const existing = emails.find(em => em.id === e.id);
          if (existing) {
            if (e.body && e.body !== existing.body) {
              existing.body = e.body;
              updatedCount++;
            }
            if (e.subject) existing.subject = e.subject;
            if (e.from) existing.from = e.from;
            if (e.date) existing.date = e.date;
          }
        }
      });
      saveState();
      renderEmailList();
      renderDetail();
      const msg = `同步完成：共 ${data.total} 封，新增 ${newCount} 封` + (updatedCount > 0 ? `，更新 ${updatedCount} 封正文` : '');
      showNotification(msg, 'success');
    } else {
      const statusRes = await fetch(apiUrl('/api/status'));
      const statusData = await statusRes.json();
      if (!statusData.connected) {
        showNotification('同步失败：后端未连接，请重新绑定邮箱', 'error');
      } else if (data.total > 0) {
        showNotification(`解析 ${data.total} 封邮件失败：可能是邮件格式不兼容。点击 🔍 诊断查看详情`, 'error');
      } else {
        showNotification(`同步完成，收件箱暂无邮件 (服务器共 ${data.total || 0} 封)`, 'success');
      }
    }
  } catch (err) {
    showNotification('同步失败: ' + err.message, 'error');
  }
  if (btn) btn.textContent = '↻';
}

async function runDiagnose() {
  document.getElementById('diagnose-modal').classList.add('open');
  const el = document.getElementById('diagnose-result');
  el.textContent = '正在诊断，请稍候...\n';

  function append(text) { el.textContent += text + '\n'; el.scrollTop = el.scrollHeight; }

  try {
    const res = await fetch(apiUrl('/api/diagnose'));
    const data = await res.json();
    append('---');
    append('邮箱: ' + data.email);
    append('服务器: ' + data.host + ':' + data.port);
    append('---');
    data.steps.forEach(s => append(s));
    append('---');
    if (data.connected) {
      append('结论: IMAP 连接成功');
      if (data.totalMessages === 0) {
        append('但是收件箱为空，请确认：');
        append('  1. QQ邮箱是否已开启 IMAP 服务');
        append('  2. 是否有邮件在收件箱（不是在垃圾箱或其他文件夹）');
        append('  3. 试试用其他 IMAP 客户端（如手机邮件App）能否正常收信');
      } else {
        append(`收件箱有 ${data.totalMessages} 封邮件，请刷新同步`);
      }
    } else {
      append('结论: IMAP 连接失败');
      if (data.error) append('错误详情: ' + data.error);
    }
  } catch (err) {
    append('无法连接到后端 API: ' + err.message);
  }
}

async function sendTestEmail() {
  const body = document.getElementById('test-email-body')?.value;
  const subject = document.getElementById('test-email-subject')?.value;
  const from = document.getElementById('test-email-from')?.value;
  if (!body) { showNotification('请输入邮件正文', 'error'); return; }
  try {
    const res = await fetch(apiUrl('/api/test-email'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from, subject, body })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '失败');
    if (data.email) {
      data.email.accountId = accounts.length > 0 ? accounts[0].id : 'a1';
      data.email.read = true;
      emails.unshift(data.email);
      activeEmailId = data.email.id;
      saveState();
      renderEmailList();
      renderDetail();
      showNotification('测试邮件已添加', 'success');
    }
    closeModal('test-email-modal');
  } catch (err) {
    showNotification('测试失败: ' + err.message, 'error');
  }
}

// ═══════════════════════════════════════════
// Render Functions
// ═══════════════════════════════════════════
function renderAccounts() {
  const el = document.getElementById('account-list');
  el.innerHTML = accounts.map(a => `
    <div class="account-item${accounts.indexOf(a) === 0 ? ' active' : ''}" onclick="selectAccount('${a.id}')">
      <span class="account-dot" style="background:${a.color}"></span>
      <span class="account-name">${esc(a.name)}</span>
      <button class="account-remove" onclick="event.stopPropagation();removeAccount('${a.id}')">✕</button>
    </div>
  `).join('');
}

function renderKeywords() {
  const el = document.getElementById('keyword-list');
  const activeKw = currentFilter !== 'all' && currentFilter !== 'today' && currentFilter !== 'flagged' ? currentFilter : '';
  el.innerHTML = keywords.map(k => `
    <span class="keyword-tag${activeKw === k.word ? ' active' : ''}" onclick="toggleKeyword('${k.word}')">
      ${esc(k.word)}
      <span class="remove" onclick="event.stopPropagation();removeKeyword('${k.id}')">✕</span>
    </span>
  `).join('') + `<span class="keyword-add" onclick="showKeywordModal()">+ 添加</span>`;
}

function renderEmailList() {
  const el = document.getElementById('email-list');
  const filtered = getFilteredEmails();
  document.getElementById('email-count').textContent = `${filtered.length} 封邮件`;
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>没有匹配的邮件</div></div>`;
    return;
  }
  el.innerHTML = filtered.map(e => {
    const acct = accounts.find(a => a.id === e.accountId);
    const matchKw = keywords.filter(k => e.body.toLowerCase().includes(k.word.toLowerCase()) || e.subject.toLowerCase().includes(k.word.toLowerCase()));
    const dates = extractDates(e.body + ' ' + e.subject);
    return `
    <div class="email-row${activeEmailId === e.id ? ' active' : ''}" onclick="selectEmail('${e.id}')">
      <div class="email-row-top">
        <span class="sender" style="${acct ? 'color:'+acct.color : ''}">${esc(e.from)}</span>
        <span class="date">${formatDate(e.date)}</span>
      </div>
      <div class="subject">${esc(e.subject)}</div>
      <div class="preview">${esc(e.body.slice(0, 80))}${e.body.length > 80 ? '…' : ''}</div>
      <div class="meta-line">
        ${matchKw.slice(0, 3).map(k => `<span class="meta-chip keyword-highlight">${esc(k.word)}</span>`).join('')}
        ${dates.slice(0, 2).map(d => `<span class="meta-chip date-chip">${esc(d)}</span>`).join('')}
        ${reminders.filter(r => r.emailId === e.id).length > 0 ? '<span class="meta-chip calendar-chip">📅 已提醒</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (!activeEmailId) {
    el.className = 'empty';
    el.innerHTML = '<div>选择一封邮件查看详情</div>';
    return;
  }
  const email = emails.find(e => e.id === activeEmailId);
  if (!email) { el.className = 'empty'; el.innerHTML = '<div>邮件不存在</div>'; return; }
  el.className = '';
  const acct = accounts.find(a => a.id === email.accountId);
  const dates = extractDates(email.body + ' ' + email.subject);
  const matchKw = keywords.filter(k => email.body.toLowerCase().includes(k.word.toLowerCase()) || email.subject.toLowerCase().includes(k.word.toLowerCase()));
  const emailReminders = reminders.filter(r => r.emailId === email.id);

  let highlightedBody = esc(email.body);
  matchKw.forEach(k => {
    const re = new RegExp('(' + escapeRegex(k.word) + ')', 'gi');
    highlightedBody = highlightedBody.replace(re, '<span class="highlight">$1</span>');
  });

  el.innerHTML = `
    <div class="detail-header">
      <div class="d-subject">${esc(email.subject)}</div>
      <div class="d-meta">
        <span><span class="label">发件人</span>${esc(email.from)}</span>
        <span><span class="label">收件人</span>${esc(email.to)}</span>
        <span><span class="label">时间</span>${formatDate(email.date, true)}</span>
        <span><span class="label">账号</span><span style="color:${acct ? acct.color : 'var(--text-secondary)'}">${acct ? esc(acct.name) : '—'}</span></span>
      </div>
    </div>
    <div class="detail-body">${highlightedBody.replace(/\n/g, '<br>')}</div>
    <div id="extraction">
      <div class="extract-header" onclick="toggleExtract()">
        <span>📋 智能提取</span>
        <span id="extract-arrow">▾</span>
      </div>
      <div class="extract-body" id="extract-body">
        ${matchKw.length > 0 ? `
        <div class="extract-group">
          <div class="extract-group-label">🔑 关键词匹配</div>
          ${matchKw.map(k => `<div class="extract-item"><span class="extract-item ei-keyword">${esc(k.word)}</span></div>`).join('')}
        </div>` : ''}
        ${dates.length > 0 ? `
        <div class="extract-group">
          <div class="extract-group-label">📅 识别到的日期</div>
          ${dates.map(d => {
            const hasReminder = emailReminders.some(r => r.date === d);
            return `<div class="extract-item">
              <span class="ei-date">${esc(d)}</span>
              <span class="ei-label">${hasReminder ? '已添加到日历' : '点击设置提醒'}</span>
              ${hasReminder
                ? `<span class="ei-action done">✓ 已添加</span>`
                : `<span class="ei-action" onclick="showReminderModal('${email.id}', '${esc(d)}', '${esc(email.subject)}')">+ 添加提醒</span>`
              }
            </div>`;
          }).join('')}
        </div>` : ''}
        ${matchKw.length === 0 && dates.length === 0 ? '<div style="font-size:12px;color:var(--text-tertiary);text-align:center;padding:8px 0;">未提取到关键信息</div>' : ''}
      </div>
    </div>
    ${renderMiniCalendar()}
  `;
}

function renderMiniCalendar() {
  const year = calendaryYear;
  const month = calendaryMonth;
  const today = new Date();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDay = firstDay.getDay();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  // Collect dates with reminders for this month
  const reminderDates = new Set();
  reminders.forEach(r => {
    const d = new Date(r.date);
    if (d.getFullYear() === year && d.getMonth() === month) reminderDates.add(d.getDate());
  });

  let days = '';
  for (let i = 0; i < startDay; i++) days += `<div class="cal-day other-month"></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
    const hasEvent = reminderDates.has(d);
    days += `<div class="cal-day${isToday ? ' today' : ''}${hasEvent ? ' has-event' : ''}">${d}</div>`;
  }
  const remaining = (7 - (days.split('<div').length - 1) % 7) % 7;
  for (let i = 0; i < remaining; i++) days += `<div class="cal-day other-month"></div>`;

  return `
  <div id="calendar-panel">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">◂</button>
      <span class="cal-title">${year}年 ${monthNames[month]}</span>
      <button onclick="changeMonth(1)">▸</button>
    </div>
    <div class="cal-grid">
      <div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div><div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div>
      ${days}
    </div>
    ${reminders.length > 0 ? `
    <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);margin-bottom:4px;">待办提醒</div>
      ${reminders.slice(0, 4).map(r => {
        const email = emails.find(e => e.id === r.emailId);
        return `<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:12px;border-radius:4px;transition:all.12s;cursor:pointer;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'" onclick="selectEmail('${r.emailId}')">
          <span style="color:var(--blue);font-size:10px;">●</span>
          <span style="color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.title)}</span>
          <span style="color:var(--text-tertiary);font-size:11px;">${r.date.slice(5)}</span>
        </div>`;
      }).join('')}
    </div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════
// Date extraction (regex-based)
// ═══════════════════════════════════════════
function extractDates(text) {
  const dates = new Set();
  // ISO dates: 2026-06-15
  const isoRe = /\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g;
  let m;
  while ((m = isoRe.exec(text)) !== null) dates.add(`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`);
  // Chinese dates: 2026年6月15日, 6月15日
  const cnRe = /(\d{4})年(\d{1,2})月(\d{1,2})日/g;
  while ((m = cnRe.exec(text)) !== null) dates.add(`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`);
  const cnRe2 = /(\d{1,2})月(\d{1,2})日/g;
  while ((m = cnRe2.exec(text)) !== null) {
    const year = new Date().getFullYear();
    dates.add(`${year}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`);
  }
  // English dates: June 15, 2026, June 15 2026, Jun 15, 2026
  const enRe = /\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\,?\s*\,?\s*(\d{4})?\b/gi;
  while ((m = enRe.exec(text)) !== null) {
    const monthMap = {'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,'july':7,'august':8,'september':9,'october':10,'november':12,'december':12,'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12};
    let month = monthMap[m[1].toLowerCase()] || 1;
    let day = parseInt(m[2]);
    let year = m[3] ? parseInt(m[3]) : (month >= new Date().getMonth() + 1 ? new Date().getFullYear() : new Date().getFullYear() + 1);
    dates.add(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`);
  }
  // "due on" pattern
  const dueRe = /(?:due|deadline|截止)\s*(?:\s*(?:on|by|为|日期|日))?\s*[：:]?\s*(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\,?\s*\,?\s*(\d{4})/gi;
  while ((m = dueRe.exec(text)) !== null) {
    const monthMap = {'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,'july':7,'august':8,'september':9,'october':10,'november':12,'december':12,'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12};
    let month = monthMap[m[1].toLowerCase()] || 1;
    let day = parseInt(m[2]);
    let year = m[3] ? parseInt(m[3]) : (month >= new Date().getMonth() + 1 ? new Date().getFullYear() : new Date().getFullYear() + 1);
    dates.add(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`);
  }
  return Array.from(dates).sort();
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ═══════════════════════════════════════════
// Filtering & Search
// ═══════════════════════════════════════════
function getFilteredEmails() {
  let list = [...emails];
  const searchTerm = (document.getElementById('search-input')?.value || '').toLowerCase();

  if (currentFilter === 'today') {
    const today = new Date();
    list = list.filter(e => {
      const d = new Date(e.date);
      return d.toDateString() === today.toDateString();
    });
  } else if (currentFilter === 'flagged') {
    const remindedIds = new Set(reminders.map(r => r.emailId));
    list = list.filter(e => remindedIds.has(e.id));
  } else if (currentFilter !== 'all') {
    list = list.filter(e => {
      const kw = currentFilter.toLowerCase();
      return e.body.toLowerCase().includes(kw) || e.subject.toLowerCase().includes(kw);
    });
  }

  if (searchTerm) {
    list = list.filter(e => {
      const subj = e.subject.toLowerCase();
      const body = e.body.toLowerCase();
      const from = e.from.toLowerCase();
      return subj.includes(searchTerm) || body.includes(searchTerm) || from.includes(searchTerm);
    });
  }

  list.sort((a, b) => new Date(b.date) - new Date(a.date));
  return list;
}

function onSearch() { renderEmailList(); }

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  // Update keyword active state
  document.querySelectorAll('.keyword-tag').forEach(el => {
    el.classList.remove('active');
  });
  renderEmailList();
  renderDetail();
}

function toggleKeyword(word) {
  if (currentFilter === word) {
    currentFilter = 'all';
  } else {
    currentFilter = word;
  }
  renderKeywords();
  renderEmailList();
  renderDetail();
}

// Actions
// ═══════════════════════════════════════════
function selectAccount(id) {
  document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.account-item:has(button[onclick*="'${id}'"])`);
  if (el) el.classList.add('active');
}

function removeAccount(id) {
  accounts = accounts.filter(a => a.id !== id);
  saveState();
  renderAccounts();
}

function selectEmail(id) {
  activeEmailId = id;
  renderEmailList();
  renderDetail();
  // Mobile: show detail panel
  if (window.innerWidth <= 900) {
    document.getElementById('detail').classList.add('open');
  }
}

function addAccount() {
  const email = document.getElementById('new-account-email').value.trim();
  const name = document.getElementById('new-account-name').value.trim() || email.split('@')[0];
  const password = document.getElementById('new-account-password').value.trim();
  const provider = document.getElementById('new-account-provider').value;
  const apiInput = document.getElementById('new-account-api-base').value.trim();

  if (!email || !email.includes('@')) { showNotification('请输入有效的邮箱地址', 'error'); return; }
  if (!password) { showNotification('请输入 IMAP 授权码', 'error'); return; }
  if (!provider) { showNotification('请选择邮箱服务商', 'error'); return; }
  if (accounts.some(a => a.email === email)) { showNotification('该邮箱已绑定', 'error'); return; }

  // Determine host/port
  let host, port;
  if (provider === 'qq') { host = 'imap.qq.com'; port = 993; }
  else if (provider === '163') { host = 'imap.163.com'; port = 993; }
  else if (provider === 'custom') {
    host = document.getElementById('new-account-host').value.trim();
    port = parseInt(document.getElementById('new-account-port').value);
    if (!host) { showNotification('请输入 IMAP 服务器地址', 'error'); return; }
    if (!port) { showNotification('请输入 IMAP 端口', 'error'); return; }
  }

  // Save API base
  if (apiInput) apiBase = apiInput;

  // Connect to IMAP via backend
  connectIMAP(email, password, host, port).then(success => {
    if (success) {
      accounts.push({ id: 'a' + Date.now(), email, name, color: selectedColor });
      saveState();
      renderAccounts();
      closeModal('account-modal');
      document.getElementById('new-account-email').value = '';
      document.getElementById('new-account-name').value = '';
      document.getElementById('new-account-password').value = '';
      document.getElementById('new-account-provider').value = '';
      document.getElementById('new-account-api-base').value = '';
      // Auto sync after bind
      setTimeout(syncEmails, 500);
    }
  });
}

function showAccountModal() {
  document.getElementById('account-modal').classList.add('open');
  const apiInput = document.getElementById('new-account-api-base');
  if (apiInput) apiInput.value = apiBase;
}

function selectColor(el) {
  document.querySelectorAll('.color-opt').forEach(c => c.style.borderColor = 'transparent');
  el.style.borderColor = 'var(--text)';
  selectedColor = el.dataset.color;
}

function showKeywordModal() { document.getElementById('keyword-modal').classList.add('open'); document.getElementById('new-keyword').focus(); }

function showTestEmailModal() { document.getElementById('test-email-modal').classList.add('open'); }

function resetAllData() {
  if (confirm('确定重置所有数据？这将清除所有账号、邮件和设置。')) {
    localStorage.removeItem('youni_state');
    location.reload();
  }
}

function addKeyword() {
  const word = document.getElementById('new-keyword').value.trim();
  if (!word) return;
  if (keywords.some(k => k.word === word)) { alert('该关键词已存在'); return; }
  keywords.push({ id: 'k' + Date.now(), word });
  saveState();
  renderKeywords();
  renderEmailList();
  renderDetail();
  closeModal('keyword-modal');
  document.getElementById('new-keyword').value = '';
}

function removeKeyword(id) {
  keywords = keywords.filter(k => k.id !== id);
  if (currentFilter === keywords.find(k => k.id === id)?.word) currentFilter = 'all';
  saveState();
  renderKeywords();
  renderEmailList();
  renderDetail();
}

function showReminderModal(emailId, dateStr, subject) {
  document.getElementById('reminder-modal').classList.add('open');
  document.getElementById('reminder-title').value = subject.length > 40 ? subject.slice(0, 40) + '…' : subject;
  document.getElementById('reminder-date').value = dateStr;
  document.getElementById('reminder-note').value = '';
  document.getElementById('reminder-modal').dataset.emailId = emailId;
  document.getElementById('reminder-modal').dataset.date = dateStr;
}

function saveReminder() {
  const emailId = document.getElementById('reminder-modal').dataset.emailId;
  const date = document.getElementById('reminder-date').value;
  const title = document.getElementById('reminder-title').value.trim();
  const note = document.getElementById('reminder-note').value.trim();
  if (!title || !date) { alert('请填写标题和日期'); return; }
  if (reminders.some(r => r.emailId === emailId && r.date === date)) { alert('该日期已设置提醒'); return; }
  reminders.push({ id: 'r' + Date.now(), emailId, date, title, note, createdAt: new Date().toISOString() });
  saveState();
  closeModal('reminder-modal');
  renderDetail();
  renderEmailList();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function toggleExtract() {
  const body = document.getElementById('extract-body');
  const arrow = document.getElementById('extract-arrow');
  if (body.style.display === 'none') {
    body.style.display = 'flex';
    arrow.textContent = '▾';
  } else {
    body.style.display = 'none';
    arrow.textContent = '▸';
  }
}

function changeMonth(delta) {
  calendaryMonth += delta;
  if (calendaryMonth < 0) { calendaryMonth = 11; calendaryYear--; }
  if (calendaryMonth > 11) { calendaryMonth = 0; calendaryYear++; }
  renderDetail();
}

// ═══════════════════════════════════════════
// Compose Email
// ═══════════════════════════════════════════
function showComposeModal() {
  document.getElementById('compose-modal').classList.add('open');
  document.getElementById('compose-to').value = '';
  document.getElementById('compose-subject').value = '';
  document.getElementById('compose-body').value = '';
  document.getElementById('compose-extract').style.display = 'none';
  document.getElementById('compose-extract-keywords').innerHTML = '';
  document.getElementById('compose-extract-dates').innerHTML = '';
  setTimeout(() => document.getElementById('compose-to').focus(), 100);
}

function onComposeInput() {
  const body = document.getElementById('compose-body').value;
  const subject = document.getElementById('compose-subject').value;
  const text = body + ' ' + subject;
  if (!text.trim()) {
    document.getElementById('compose-extract').style.display = 'none';
    return;
  }
  const dates = extractDates(text);
  const matchKw = keywords.filter(k => text.toLowerCase().includes(k.word.toLowerCase()));
  const kwEl = document.getElementById('compose-extract-keywords');
  const dtEl = document.getElementById('compose-extract-dates');
  kwEl.innerHTML = matchKw.map(k => `<span style="background:var(--accent-dim);padding:2px 6px;border-radius:3px;">${esc(k.word)}</span>`).join('');
  dtEl.innerHTML = dates.map(d => `<span style="background:rgba(245,158,95,0.1);padding:2px 6px;border-radius:3px;">${esc(d)}</span>`).join('');
  const extractEl = document.getElementById('compose-extract');
  if (matchKw.length > 0 || dates.length > 0) {
    extractEl.style.display = 'flex';
  } else {
    extractEl.style.display = 'none';
  }
}

function sendCompose() {
  const to = document.getElementById('compose-to').value.trim();
  const subject = document.getElementById('compose-subject').value.trim();
  const body = document.getElementById('compose-body').value.trim();
  if (!to || !to.includes('@')) { alert('请输入有效的收件人地址'); return; }
  if (!subject) { alert('请输入邮件主题'); return; }
  if (!body) { alert('请输入邮件正文'); return; }
  const acctId = accounts.length > 0 ? accounts[0].id : 'a1';
  const newEmail = {
    id: 'e' + Date.now(),
    accountId: acctId,
    from: accounts.length > 0 ? accounts[0].email : 'me@youni.app',
    to: to,
    subject: subject,
    body: body,
    date: new Date().toISOString(),
    read: false
  };
  emails.unshift(newEmail);
  activeEmailId = newEmail.id;
  saveState();
  closeModal('compose-modal');
  renderEmailList();
  renderDetail();
}

// ═══════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatDate(iso, full) {
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / (1000 * 60 * 60 * 24);
  if (diff < 1 && d.getDate() === now.getDate()) {
    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  if (diff < 2) return '昨天';
  if (diff < 7) return `${Math.floor(diff)}天前`;
  if (full) return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}
